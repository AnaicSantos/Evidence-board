<!DOCTYPE html>
<html>
<head>
    <title>Evidence Board</title>

<style>
body {
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #eef2f7, #dfe6ee);
    margin: 0;
}

h1 {
    text-align: center;
    margin: 20px;
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    left: 20px;
    top: 120px;
    background: white;
    padding: 10px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 9999;
}

.tool {
    position: relative;
}

.sidebar button {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    font-size: 20px;
    background: #e5e7eb;
}

.sidebar button.active {
    background: #6366f1;
    color: white;
}

/* PALETA SIDEBAR */
.sidebarPalette {
    position: absolute;
    left: 60px;
    top: 0;
    display: none;
    gap: 5px;
    background: white;
    padding: 5px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* CORES */
.color {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    cursor: pointer;
}

/* cor ativa */
.selectedColor {
    border: 2px solid black;
}

/* BOARD */
#board {
    width: 95%;
    height: 600px;
    margin: auto;
    background: white;
    border-radius: 16px;
    position: relative;
}

/* NODE */
.node {
    position: absolute;
    padding: 12px;
    border-radius: 12px;
    min-width: 100px;
    text-align: center;
    cursor: grab;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    transition: all 0.2s ease;
}

.node:hover {
    transform: scale(1.08);
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

/* PALETA NOTAS */
.palette {
    position: absolute;
    top: -30px;
    left: 0;
    display: none;
    gap: 5px;
}
</style>
</head>

<body>

<h1>Evidence Board</h1>

<div class="sidebar">

    <button onclick="setMode('select')" id="btnSelect">🖱️</button>
    <button onclick="setMode('line')" id="btnLine">🔀</button>

    <div class="tool">
        <button onclick="setMode('node')" id="btnNode">📄</button>

        <div class="sidebarPalette">
            <div class="color selectedColor" style="background:#fde68a" onclick="setSelectedColor('#fde68a', event)"></div>
            <div class="color" style="background:#fecaca" onclick="setSelectedColor('#fecaca', event)"></div>
            <div class="color" style="background:#bfdbfe" onclick="setSelectedColor('#bfdbfe', event)"></div>
            <div class="color" style="background:#bbf7d0" onclick="setSelectedColor('#bbf7d0', event)"></div>
        </div>
    </div>

</div>

<div id="board"></div>

<script src="./graph.js"></script>

<script>
let graph = new Graph();
let positions = {};
let nodeColors = {};

let selectedColor = "#fde68a";
let mode = "select";
let startNode = null;

/* MODOS */
function setMode(m) {
    mode = m;

    document.querySelectorAll(".sidebar button").forEach(btn => btn.classList.remove("active"));
    if (m === "select") btnSelect.classList.add("active");
    if (m === "line") btnLine.classList.add("active");
    if (m === "node") btnNode.classList.add("active");

    let board = document.getElementById("board");

    if (mode === "select") board.style.cursor = "default";
    if (mode === "line") board.style.cursor = "crosshair";
    if (mode === "node") board.style.cursor = "copy";
}

/* COR */
function setSelectedColor(color, e) {
    selectedColor = color;

    document.querySelectorAll(".sidebarPalette .color").forEach(c => {
        c.classList.remove("selectedColor");
    });

    e.target.classList.add("selectedColor");
}

/* DELAY PALETA */
let tool = document.querySelector(".tool");
let paletteSidebar = document.querySelector(".sidebarPalette");
let timeoutSidebar;

tool.addEventListener("mouseenter", () => {
    clearTimeout(timeoutSidebar);
    paletteSidebar.style.display = "flex";
});

tool.addEventListener("mouseleave", () => {
    timeoutSidebar = setTimeout(() => {
        paletteSidebar.style.display = "none";
    }, 300);
});

paletteSidebar.addEventListener("mouseenter", () => {
    clearTimeout(timeoutSidebar);
});

paletteSidebar.addEventListener("mouseleave", () => {
    paletteSidebar.style.display = "none";
});

/* CRIAR NÓ */
document.getElementById("board").onclick = function(e) {
    if (mode === "node") {

        let name = prompt("Texto da nota:");
        if (!name) return;

        graph.addNode(name);
        nodeColors[name] = selectedColor;

        positions[name] = { x: e.offsetX, y: e.offsetY };

        updateBoard();
    }
};

/* UPDATE */
function updateBoard() {
    document.querySelectorAll(".node").forEach(n => n.remove());

    let board = document.getElementById("board");

    for (let node in graph.nodes) {

        let div = document.createElement("div");
        div.className = "node";
        div.textContent = node;

        div.style.background = nodeColors[node];
        div.style.left = positions[node].x + "px";
        div.style.top = positions[node].y + "px";

        /* PALETA NOTA */
        let palette = document.createElement("div");
        palette.className = "palette";

        ["#fde68a","#fecaca","#bfdbfe","#bbf7d0"].forEach(color => {
            let c = document.createElement("div");
            c.className = "color";
            c.style.background = color;

            c.onclick = (e) => {
                e.stopPropagation();
                nodeColors[node] = color;
                updateBoard();
            };

            palette.appendChild(c);
        });

        div.appendChild(palette);

        /* HOVER FIX */
        let timeout;

        div.addEventListener("mouseenter", () => {
            clearTimeout(timeout);
            palette.style.display = "flex";
        });

        div.addEventListener("mouseleave", () => {
            timeout = setTimeout(() => {
                palette.style.display = "none";
            }, 300);
        });

        palette.addEventListener("mouseenter", () => {
            clearTimeout(timeout);
        });

        palette.addEventListener("mouseleave", () => {
            palette.style.display = "none";
        });

        /* DRAG + LIGAÇÃO */
        div.onmousedown = function(e) {
            if (mode === "select") {
                let offsetX = e.clientX - div.offsetLeft;
                let offsetY = e.clientY - div.offsetTop;

                document.onmousemove = function(e) {
                    let x = e.clientX - offsetX;
                    let y = e.clientY - offsetY;

                    div.style.left = x + "px";
                    div.style.top = y + "px";

                    positions[node] = {x, y};
                };

                document.onmouseup = function() {
                    document.onmousemove = null;
                };
            } else if (mode === "line") {
                startNode = node;
                div.style.outline = "3px solid #6366f1";
            }
        };

        div.onmouseup = function() {
            if (mode === "line" && startNode && startNode !== node) {
                graph.addEdge(startNode, node);
                startNode = null;
                updateBoard();
            }
        };

        board.appendChild(div);
    }
}
</script>

</body>
</html>
