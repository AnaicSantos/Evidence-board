<!DOCTYPE html>
<html>
<head>
    <title>Evidence Board</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body {
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #eef2f7, #dfe6ee);
    margin: 0;
}

h1 {
    text-align: center;
    margin: 20px;
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    left: 20px;
    top: 120px;
    background: white;
    padding: 12px;
    border-radius: 14px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    z-index: 1000;
}

.sidebar button {
    margin: 6px 0;
    padding: 12px;
    border: none;
    background: #f1f5f9;
    border-radius: 10px;
    cursor: pointer;
}

.sidebar button.active {
    background: #6366f1;
    color: white;
}

/* BOARD */
#board {
    width: 95%;
    height: 600px;
    margin: auto;
    background: white;
    border-radius: 16px;
    position: relative;
}

/* CANVAS */
#canvas {
    position: absolute;
    width: 100%;
    height: 100%;
}

/* NODE */
.node {
    position: absolute;
    background: linear-gradient(145deg, #fde68a, #facc15);
    padding: 12px;
    border-radius: 12px;
    min-width: 100px;
    text-align: center;
    cursor: grab;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<h1>Evidence Board</h1>

<div class="sidebar">
    <button onclick="setMode('select')" id="btnSelect"><i class="fa-solid fa-arrow-pointer"></i></button>
    <button onclick="setMode('line')" id="btnLine"><i class="fa-solid fa-diagram-project"></i></button>
    <button onclick="setMode('node')" id="btnNode"><i class="fa-solid fa-note-sticky"></i></button>
</div>

<div id="board">
    <canvas id="canvas"></canvas>
</div>

<script src="./graph.js"></script>

<script>
let graph = new Graph();
let positions = {};

let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let mode = "select";
let startNode = null;
let isDrawingLine = false;

/* MODOS */
function setMode(m) {
    mode = m;
    startNode = null;
    isDrawingLine = false;

    document.querySelectorAll(".sidebar button").forEach(btn => btn.classList.remove("active"));
    if (m === "select") btnSelect.classList.add("active");
    if (m === "line") btnLine.classList.add("active");
    if (m === "node") btnNode.classList.add("active");
}

/* CANVAS */
function resizeCanvas() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    drawLines();
}
window.onload = () => {
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    setMode("select");
};

/* CRIAR NÓ */
document.getElementById("board").onclick = function(e) {
    if (mode === "node" && !e.target.closest(".node")) {

        let name = prompt("Texto:");
        if (!name) return;

        graph.addNode(name);

        positions[name] = { x: e.offsetX, y: e.offsetY };

        updateBoard();
    }
};

/* UPDATE */
function updateBoard() {
    document.querySelectorAll(".node").forEach(n => n.remove());

    let board = document.getElementById("board");

    for (let node in graph.nodes) {

        let div = document.createElement("div");
        div.className = "node";
        div.textContent = node;
        div.dataset.name = node;

        div.style.left = positions[node].x + "px";
        div.style.top = positions[node].y + "px";

        /* INICIAR LIGAÇÃO */
        div.addEventListener("mousedown", (e) => {
            if (mode !== "line") return;

            e.stopPropagation();
            startNode = node;
            isDrawingLine = true;
        });

        /* TERMINAR LIGAÇÃO */
        div.addEventListener("mouseup", (e) => {
            if (!isDrawingLine || !startNode) return;

            let endNode = e.target.dataset.name;

            if (startNode !== endNode) {
                graph.addEdge(startNode, endNode);
            }

            startNode = null;
            isDrawingLine = false;

            updateBoard();
        });

        makeDraggable(div, node);
        board.appendChild(div);
    }

    drawLines();
}

/* DRAG */
function makeDraggable(el, node) {
    let offsetX, offsetY;

    el.onmousedown = function(e) {
        if (mode !== "select") return;

        offsetX = e.clientX - el.offsetLeft;
        offsetY = e.clientY - el.offsetTop;

        document.onmousemove = function(e) {
            let x = e.clientX - offsetX;
            let y = e.clientY - offsetY;

            el.style.left = x + "px";
            el.style.top = y + "px";

            positions[node] = {x, y};
            drawLines();
        };

        document.onmouseup = function() {
            document.onmousemove = null;
        };
    };
}

/* DESENHAR LINHAS */
function drawLines() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    for (let node in graph.nodes) {
        for (let conn of graph.nodes[node]) {

            let p1 = positions[node];
            let p2 = positions[conn];

            if (!p1 || !p2) continue;

            ctx.beginPath();
            ctx.moveTo(p1.x + 60, p1.y + 30);
            ctx.lineTo(p2.x + 60, p2.y + 30);

            ctx.strokeStyle = "#4f46e5";
            ctx.lineWidth = 3;
            ctx.stroke();
        }
    }
}
</script>

</body>
</html>
